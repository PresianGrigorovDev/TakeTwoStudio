---
# cPanel Git Version Control -> "Deploy HEAD Commit" runs these after the checkout
# is updated in place (/home/mbgsqksf/public_html == this repository).
# "Update from Remote" alone does NOT run them - use Deploy, or run the same
# commands over SSH:  cd ~/public_html && php artisan optimize:clear && php artisan migrate --force && php artisan optimize
deployment:
  tasks:
    - export DEPLOYPATH=/home/mbgsqksf/public_html
    - cd $DEPLOYPATH && php artisan optimize:clear
    - cd $DEPLOYPATH && php artisan migrate --force
    # SeoContentSeeder is NOT re-run on deploy: it would re-create FAQs edited or deleted in Filament.
    # Fit uploaded team photos / portfolio covers to their display size + localise the Pixieset
    # cover. Idempotent (a re-run changes nothing), always exits 0. --skip-public: public/css/img
    # is optimised locally and shipped via git - never modify tracked files here (it would block pulls).
    - cd $DEPLOYPATH && php artisan images:optimize-all --skip-public --no-interaction || true
    - cd $DEPLOYPATH && php artisan optimize
    # IndexNow: models ping changed URLs on save; run `php artisan seo:indexnow --all` by hand only after URL-wide changes.
